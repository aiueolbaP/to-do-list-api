name: Java Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  EC2_HOST: ${{ secrets.EC2_HOST != '' && secrets.EC2_HOST || '3.145.138.105' }}
  EC2_USER: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || 'ubuntu' }}
  APP_DIR: "/home/ubuntu/to-do-list-api"

jobs:
  # ==========================================
  # 1. BUILD
  # ==========================================
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw compile

  # ==========================================
  # 2. TEST
  # ==========================================
  test:
    name: 2. Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: |
          chmod +x ./mvnw
          ./mvnw test

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  # ==========================================
  # 3. QUALITY & PACKAGING
  # ==========================================
  quality:
    name: 3. Quality & Packaging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR Application
        run: |
          chmod +x ./mvnw
          ./mvnw package -DskipTests
          mkdir -p build/libs
          cp target/*.jar build/libs/to-do-list-api-0.0.1-SNAPSHOT.jar
          ls -lh build/libs/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: to-do-list-api-jar
          path: build/libs/to-do-list-api-0.0.1-SNAPSHOT.jar

  # ==========================================
  # 4. PACKING (Transfer to AWS EC2)
  # ==========================================
  packing:
    name: 4. Packing (SCP to EC2)
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: to-do-list-api-jar
          path: build/libs/

      - name: Setup SSH Key
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AWS_KEY" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem

      - name: Copy JAR to AWS EC2
        run: |
          echo "Conectando a EC2 ($EC2_HOST) para copiar la nueva versión..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ${EC2_USER}@${EC2_HOST} "mkdir -p ${APP_DIR}"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem build/libs/to-do-list-api-0.0.1-SNAPSHOT.jar ${EC2_USER}@${EC2_HOST}:${APP_DIR}/api.jar

  # ==========================================
  # 5. DEPLOY (Restart Service on AWS EC2)
  # ==========================================
  deploy:
    name: 5. Deploy (Run on EC2)
    needs: packing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Setup SSH Key
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AWS_KEY" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem

      - name: Restart Application on EC2
        run: |
          echo "Verificando instalación de Java en el servidor..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ${EC2_USER}@${EC2_HOST} "which java > /dev/null || (sudo apt-get update -y && sudo apt-get install -y openjdk-17-jre-headless)"
          echo "Detiene cualquier instancia previa de la API en ejecución..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ${EC2_USER}@${EC2_HOST} "nohup pkill -f 'java -jar' > /dev/null 2>&1 &" || true
          sleep 2
          echo "Ejecuta la nueva versión en segundo plano..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ${EC2_USER}@${EC2_HOST} "nohup java -jar ${APP_DIR}/api.jar > ${APP_DIR}/app.log 2>&1 &"
          sleep 5
          echo "Verificando proceso activo en el servidor..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ${EC2_USER}@${EC2_HOST} "pgrep -f 'java -jar' && echo 'Despliegue exitoso' || (cat ${APP_DIR}/app.log; exit 1)"
